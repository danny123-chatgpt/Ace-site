<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send Feedback</title>⇝

<style>
:root {
  --bg: #14161c;
  --card: #1f222b;
  --field: #2a2e3a;
  --text: #f2f4f8;
  --muted: #9aa1b2;
  --accent: #7c5cff;
  --accent-hover: #6a4aea;
  --error: #ff5d6c;
  --success: #00c8aa;
  --border: #3a3f4e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(124,92,255,.25), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(0,200,170,.18), transparent 40%);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--text);
}
.card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px;
  box-shadow: 0 20px 50px rgba(0,0,0,.45);
}
.logo {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 8px;
}
.logo-mark {
  width: 38px; height: 38px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--success));
  transform: rotate(-8deg);
}
.logo-text { font-size: 1.6rem; font-weight: 800; letter-spacing: .5px; }
.subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: .92rem; }
label { display: block; font-size: .85rem; margin-bottom: 6px; color: var(--muted); }
.field { margin-bottom: 16px; position: relative; }
input, textarea, select {
  width: 100%;
  padding: 12px 14px;
  background: var(--field);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: .95rem;
  outline: none;
  font-family: inherit;
  transition: border-color .15s;
}
textarea { resize: vertical; min-height: 110px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input.invalid, textarea.invalid { border-color: var(--error); }
.error { color: var(--error); font-size: .8rem; margin-top: 5px; min-height: 1em; }
.charcount { text-align: right; font-size: .75rem; color: var(--muted); margin-top: 3px; }

.btn-primary {
  width: 100%; padding: 13px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-size: 1.02rem; font-weight: 700; cursor: pointer;
  transition: background .15s, transform .05s, opacity .15s;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }

.banner {
  display: none; margin-bottom: 16px; padding: 10px 12px;
  border-radius: 8px; font-size: .9rem; text-align: center;
}
.banner.success { background: rgba(0,200,170,.15); border: 1px solid var(--success); color: #6ff0d8; }
.banner.fail { background: rgba(255,93,108,.15); border: 1px solid var(--error); color: #ffb3bb; }
</style>

</head>
<body>
  <main class="card">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-text">Send Feedback</span>
    </div>
    <p class="subtitle">Preview the feedback form. Messages are not transmitted or stored.</p>

    <div class="banner" id="banner"></div>

    <form id="feedbackForm" novalidate>
      <div class="field">
        <label for="name">Your Name</label>
        <input id="name" type="text" placeholder="e.g. Juan Dela Cruz" autocomplete="name">
        <div class="error" id="nameError"></div>
      </div>

      <div class="field">
        <label for="category">Type of Feedback</label>
        <select id="category">
          <option value="Suggestion">Suggestion</option>
          <option value="Bug Report">Bug Report</option>
          <option value="Compliment">Compliment</option>
          <option value="Complaint">Complaint</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" maxlength="1500" placeholder="Type your feedback here..."></textarea>
        <div class="charcount"><span id="charCount">0</span>/1500</div>
        <div class="error" id="messageError"></div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Send Feedback</button>
    </form>
  </main>

  <script>

const form = document.getElementById('feedbackForm');
const nameInput = document.getElementById('name');
const messageInput = document.getElementById('message');
const nameError = document.getElementById('nameError');
const messageError = document.getElementById('messageError');
const charCount = document.getElementById('charCount');
const banner = document.getElementById('banner');

messageInput.addEventListener('input', () => {
  charCount.textContent = messageInput.value.length;
});

function setError(input, el, msg) {
  el.textContent = msg;
  input.classList.toggle('invalid', !!msg);
}

function showBanner(type, text) {
  banner.className = 'banner ' + type;
  banner.textContent = text;
  banner.style.display = 'block';
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  banner.style.display = 'none';
  const name = nameInput.value.trim();
  const message = messageInput.value.trim();
  let ok = true;
  if (name.length < 2) {
    setError(nameInput, nameError, 'Please enter your name.');
    ok = false;
  } else setError(nameInput, nameError, '');
  if (message.length < 5) {
    setError(messageInput, messageError, 'Please write at least 5 characters.');
    ok = false;
  } else setError(messageInput, messageError, '');
  if (!ok) return;
  showBanner('fail', 'Demo only: your feedback was not sent or stored.');
});

</script>
</body>
</html>
